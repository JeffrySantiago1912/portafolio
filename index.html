    <title>Jeffry Santiago | Full Stack Developer | AI &amp; Automation</title>
    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem('portfolio-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = theme === 'dark' || (!theme && prefersDark)
          if (dark) document.documentElement.classList.add('dark')
          var locale = localStorage.getItem('portfolio-locale')
          var lang = locale === 'es' || locale === 'en' ? locale : 'en'
          document.documentElement.lang = lang
          var color = dark ? '#101412' : '#f3f0e8'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', color)
        } catch (e) {}
      })()
    </script>
